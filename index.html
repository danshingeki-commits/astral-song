<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Astral Music</title>
  <link rel="manifest" href="manifest.json">
  <!-- Fuentes: Silkscreen (Pixel retro estilo ViviMusic) + Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    :root {
      --bg-main: #0c1015;
      --bg-card: #151b23;
      --bg-card-hover: #1c232d;
      --accent-blue: #82c3f8;
      --accent-blue-active: #67aee8;
      --text-main: #ffffff;
      --text-muted: #8b9bb4;
      --border-soft: rgba(255, 255, 255, 0.06);
      --font-pixel: 'Silkscreen', monospace;
      --font-ui: 'Plus Jakarta Sans', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-ui);
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
    }

    .app-viewport {
      display: flex;
      flex-direction: column;
      height: 100vh;
      position: relative;
    }

    /* VISTAS */
    .view {
      display: none;
      flex: 1;
      overflow-y: auto;
      padding: 16px 16px 140px 16px;
      scrollbar-width: none;
    }
    .view::-webkit-scrollbar { display: none; }
    .view.active { display: block; }

    /* CABECERA VIVIMUSIC */
    .vivi-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .vivi-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .vivi-logo-icon {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #a855f7, var(--accent-blue));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #0c1015;
    }
    .vivi-brand h1 {
      font-family: var(--font-pixel);
      font-size: 1.35rem;
      letter-spacing: -0.5px;
    }
    .header-action-btn {
      background: transparent;
      border: none;
      color: var(--accent-blue);
      font-size: 1.25rem;
    }

    /* CHIPS FILTROS SUPERIORES */
    .chips-carousel {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 18px;
      scrollbar-width: none;
    }
    .chips-carousel::-webkit-scrollbar { display: none; }
    .vivi-chip {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      color: #cbd5e1;
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      padding: 7px 14px;
      border-radius: 12px;
      white-space: nowrap;
      transition: all 0.2s;
    }
    .vivi-chip.active {
      background: var(--accent-blue);
      color: #0c1015;
      border-color: var(--accent-blue);
      font-weight: 700;
    }

    /* ENCABEZADOS DE SECCIÓN */
    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 12px 0;
    }
    .section-head h2 {
      font-family: var(--font-pixel);
      font-size: 1.05rem;
      color: #f1f5f9;
      letter-spacing: -0.5px;
    }
    .pill-action {
      background: transparent;
      border: 1px solid var(--border-soft);
      color: var(--accent-blue);
      font-family: var(--font-pixel);
      font-size: 0.65rem;
      padding: 4px 10px;
      border-radius: 14px;
    }

    /* DAILY DISCOVERY (CARRUSEL GRANDE) */
    .hero-carousel {
      display: flex;
      gap: 12px;
      overflow-x: auto;
      padding-bottom: 8px;
      scrollbar-width: none;
    }
    .hero-carousel::-webkit-scrollbar { display: none; }
    .hero-card {
      min-width: 250px;
      width: 250px;
      height: 160px;
      background: var(--bg-card);
      border-radius: 18px;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px;
      border: 1px solid var(--border-soft);
    }
    .hero-card img {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      opacity: 0.55;
    }
    .hero-card .hero-meta {
      position: relative;
      z-index: 2;
    }
    .hero-card .hero-title {
      font-family: var(--font-pixel);
      font-size: 0.85rem;
      color: #fff;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .hero-card .hero-sub {
      font-size: 0.72rem;
      color: #cbd5e1;
      margin-top: 4px;
    }

    /* COMMUNITY CARDS (GRUPO DE 3 PISTAS) */
    .community-cards-flow {
      display: flex;
      gap: 14px;
      overflow-x: auto;
      padding-bottom: 12px;
      scrollbar-width: none;
    }
    .community-cards-flow::-webkit-scrollbar { display: none; }
    .grouped-card {
      min-width: 275px;
      width: 275px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 20px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .grouped-card-header h3 {
      font-family: var(--font-pixel);
      font-size: 0.82rem;
      color: #fff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .grouped-card-header span {
      font-size: 0.72rem;
      color: var(--text-muted);
    }
    .mini-track-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px;
      border-radius: 8px;
    }
    .mini-track-item:active { background: var(--bg-card-hover); }
    .mini-track-item img {
      width: 40px;
      height: 40px;
      border-radius: 8px;
      object-fit: cover;
    }
    .mini-track-info {
      flex: 1;
      min-width: 0;
    }
    .mini-track-title {
      font-family: var(--font-pixel);
      font-size: 0.7rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #f1f5f9;
    }
    .mini-track-artist {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .grouped-card-actions {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 4px;
    }
    .btn-vivi-play {
      flex: 1;
      background: var(--accent-blue);
      color: #0c1015;
      border: none;
      padding: 8px 12px;
      border-radius: 18px;
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 700;
    }
    .btn-circle-action {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #1e2632;
      border: 1px solid var(--border-soft);
      color: var(--accent-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    /* BUSCADOR */
    .vivi-search-box {
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      border-radius: 14px;
      display: flex;
      align-items: center;
      padding: 10px 14px;
      gap: 10px;
      margin-bottom: 14px;
    }
    .vivi-search-box input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #fff;
      font-family: var(--font-pixel);
      font-size: 0.82rem;
    }
    .vivi-search-box input::placeholder {
      font-family: var(--font-ui);
      color: #64748b;
    }
    .results-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .search-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-soft);
      padding: 8px 10px;
      border-radius: 12px;
    }
    .search-row img {
      width: 44px;
      height: 44px;
      border-radius: 8px;
      object-fit: cover;
    }
    .search-row-title {
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .search-row-artist {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    /* MINI PLAYER FLOTANTE */
    .vivi-mini-player {
      position: fixed;
      bottom: 68px;
      left: 10px;
      right: 10px;
      height: 58px;
      background: #171d26;
      border: 1px solid rgba(130, 195, 248, 0.2);
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 0 12px;
      z-index: 90;
      box-shadow: 0 8px 24px rgba(0,0,0,0.7);
    }
    .mini-progress {
      position: absolute;
      top: 0; left: 0;
      height: 2px;
      background: var(--accent-blue);
      width: 0%;
      border-radius: 16px 16px 0 0;
    }
    .mini-tap-area {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }
    .mini-tap-area img {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      object-fit: cover;
    }
    .mini-titles {
      flex: 1;
      min-width: 0;
    }
    .mini-titles .title {
      font-family: var(--font-pixel);
      font-size: 0.72rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .mini-titles .artist {
      font-size: 0.68rem;
      color: var(--text-muted);
    }
    .mini-play-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #0c1015;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
    }

    /* BARRA INFERIOR */
    .vivi-bottom-nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 62px;
      background: #0d1117;
      border-top: 1px solid var(--border-soft);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-button {
      background: transparent;
      border: none;
      color: #64748b;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      font-family: var(--font-pixel);
      font-size: 0.62rem;
    }
    .nav-button i { font-size: 1.15rem; }
    .nav-button.active {
      color: var(--accent-blue);
    }

    /* FULL PLAYER DESLIZANTE */
    .full-player-sheet {
      position: fixed;
      top: 100%;
      left: 0; right: 0;
      height: 100vh;
      background: #0c1015;
      z-index: 200;
      display: flex;
      flex-direction: column;
      padding: 24px 20px;
      transition: top 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .full-player-sheet.open { top: 0; }
    .sheet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: var(--font-pixel);
      font-size: 0.75rem;
    }
    .sheet-bar span { color: var(--text-muted); }
    .btn-speed-badge {
      background: #18202a;
      border: 1px solid var(--border-soft);
      color: var(--accent-blue);
      font-family: var(--font-pixel);
      font-size: 0.68rem;
      padding: 4px 10px;
      border-radius: 12px;
    }
    .full-art-box {
      margin: 28px auto;
      width: 78vw;
      max-width: 320px;
      aspect-ratio: 1;
    }
    .full-art-box img {
      width: 100%; height: 100%;
      border-radius: 20px;
      object-fit: cover;
      box-shadow: 0 12px 30px rgba(0,0,0,0.8);
    }
    .full-meta h2 {
      font-family: var(--font-pixel);
      font-size: 1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .full-meta p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 4px;
    }
    .full-progress-wrap {
      margin-top: 25px;
    }
    .full-progress-bar {
      width: 100%;
      height: 5px;
      background: #1e2632;
      border-radius: 3px;
    }
    .full-progress-fill {
      width: 0%;
      height: 100%;
      background: var(--accent-blue);
      border-radius: 3px;
    }
    .time-flex {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 6px;
    }
    .full-controls-row {
      display: flex;
      justify-content: space-evenly;
      align-items: center;
      margin-top: 30px;
    }
    .btn-ctrl-round {
      border: none;
      background: transparent;
      color: #fff;
      font-size: 1.5rem;
    }
    .btn-play-massive {
      width: 66px;
      height: 66px;
      border-radius: 50%;
      background: var(--accent-blue);
      color: #0c1015;
      border: none;
      font-size: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .empty-pixel-msg {
      text-align: center;
      margin-top: 50px;
      font-family: var(--font-pixel);
      font-size: 0.75rem;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="app-viewport">

    <!-- PESTAÑA 1: INICIO (ESTILO VIVIMUSIC) -->
    <main id="tabHome" class="view active">
      <header class="vivi-header">
        <div class="vivi-brand">
          <div class="vivi-logo-icon"><i class="fas fa-compact-disc"></i></div>
          <h1>Music</h1>
        </div>
        <button class="header-action-btn"><i class="fas fa-gear"></i></button>
      </header>

      <!-- CHIPS DE FILTRO VIVIMUSIC -->
      <div class="chips-carousel">
        <button class="vivi-chip active" onclick="filtrarCategoria('Entrenamiento')">Entrenamiento</button>
        <button class="vivi-chip" onclick="filtrarCategoria('Energía')">Energía</button>
        <button class="vivi-chip" onclick="filtrarCategoria('Sentirse bien')">Sentirse bien</button>
        <button class="vivi-chip" onclick="filtrarCategoria('Slowed reverb')">Slowed</button>
        <button class="vivi-chip" onclick="filtrarCategoria('Phonk')">Phonk</button>
      </div>

      <!-- SECCIÓN 1: YOUR DAILY DISCO... -->
      <div class="section-head">
        <h2>Your daily disco...</h2>
        <button class="pill-action" onclick="reproducirTodo()">Reproducir todo</button>
      </div>
      <div class="hero-carousel" id="heroList">
        <div class="empty-pixel-msg">Cargando catálogo...</div>
      </div>

      <!-- SECCIÓN 2: FROM THE COMMUNITY (3 CANCIONES POR TARJETA) -->
      <div class="section-head">
        <h2>From the community</h2>
      </div>
      <div class="community-cards-flow" id="communityList">
        <div class="empty-pixel-msg">Cargando pistas...</div>
      </div>
    </main>

    <!-- PESTAÑA 2: BUSCAR -->
    <main id="tabSearch" class="view">
      <div class="vivi-search-box">
        <i class="fas fa-search" style="color: var(--accent-blue);"></i>
        <input type="text" id="searchInput" placeholder="Buscar canciones, artistas o slowed..." autocomplete="off">
      </div>
      <div class="results-list" id="searchResults">
        <div class="empty-pixel-msg">Escribe arriba para explorar</div>
      </div>
    </main>

    <!-- PESTAÑA 3: BIBLIOTECA -->
    <main id="tabLibrary" class="view">
      <div class="section-head">
        <h2>Tu Biblioteca</h2>
      </div>
      <div class="results-list" id="libraryList">
        <div class="empty-pixel-msg">Tus temas reproducidos saldrán aquí</div>
      </div>
    </main>

    <!-- MINI PLAYER FLOTANTE -->
    <div class="vivi-mini-player" id="miniPlayer">
      <div class="mini-progress" id="miniProgressBar"></div>
      <div class="mini-tap-area" id="triggerFullPlayer">
        <img id="miniCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&q=80" alt="Art">
        <div class="mini-titles">
          <div class="title" id="miniTitle">Astral Music</div>
          <div class="artist" id="miniArtist">Toca una canción</div>
        </div>
      </div>
      <button class="mini-play-btn" id="btnPlayMini"><i class="fas fa-play" id="miniPlayIcon"></i></button>
    </div>

    <!-- NAVEGACIÓN INFERIOR (INICIO / BUSCAR / BIBLIOTECA) -->
    <nav class="vivi-bottom-nav">
      <button class="nav-button active" data-tab="tabHome">
        <i class="fas fa-house"></i>
        <span>Inicio</span>
      </button>
      <button class="nav-button" data-tab="tabSearch">
        <i class="fas fa-magnifying-glass"></i>
        <span>Buscar</span>
      </button>
      <button class="nav-button" data-tab="tabLibrary">
        <i class="fas fa-bookmark"></i>
        <span>Biblioteca</span>
      </button>
    </nav>

    <!-- FULL PLAYER EXPANDIDO -->
    <div class="full-player-sheet" id="fullPlayer">
      <div class="sheet-bar">
        <button id="btnCloseFull" style="background:none;border:none;color:#fff;font-size:1.2rem;"><i class="fas fa-chevron-down"></i></button>
        <span>REPRODUCIENDO</span>
        <button class="btn-speed-badge" id="btnSpeed">1.0x</button>
      </div>

      <div class="full-art-box">
        <img id="fullCover" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=500&q=80" alt="Art">
      </div>

      <div class="full-meta">
        <h2 id="fullTitle">Astral Music</h2>
        <p id="fullArtist">Selecciona una pista</p>
      </div>

      <div class="full-progress-wrap">
        <div class="full-progress-bar" id="fullProgressBox">
          <div class="full-progress-fill" id="fullProgressBar"></div>
        </div>
        <div class="time-flex">
          <span id="currentTime">0:00</span>
          <span id="totalDuration">0:00</span>
        </div>
      </div>

      <div class="full-controls-row">
        <button class="btn-ctrl-round" id="btnPrev"><i class="fas fa-backward-step"></i></button>
        <button class="btn-play-massive" id="btnPlayFull"><i class="fas fa-play" id="fullPlayIcon"></i></button>
        <button class="btn-ctrl-round" id="btnNext"><i class="fas fa-forward-step"></i></button>
      </div>
    </div>

  </div>

  <!-- REPRODUCTOR OFICIAL ACTIVO (OCULTO FUERA DE PANTALLA PARA EVITAR BLOQUEOS EN CHROME) -->
  <div style="position: absolute; top: -9999px; left: -9999px; width: 300px; height: 200px; pointer-events: none;">
    <div id="ytPlayer"></div>
  </div>

  <script src="app.js?v=fix_play_vivi"></script>
</body>
</html>
